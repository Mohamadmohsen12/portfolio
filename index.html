.nbg{position:absolute;inset:0;border-radius:16px;overflow:hidden;z-index:0}
.nbg::before{content:"";position:absolute;left:50%;top:50%;width:900px;height:900px;transform:translate(-50%,-50%) rotate(60deg);background:conic-gradient(#0000,#7E00C7 8%,#0000 26%,#0000 50%,#FFD600 60%,#0000 76%);filter:blur(2px);transition:transform 2s}
